version: 2
updates:
  # Minor and patch updates arrive as one weekly pull request; a major update gets its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
