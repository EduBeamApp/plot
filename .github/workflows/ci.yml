name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile pins every dependency, ts-fem's GitHub commit included.
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

      # Lists what would ship, so a stray file in the package shows up in the log.
      - run: npm pack --dry-run
