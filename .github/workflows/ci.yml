name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile pins every dependency.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The tests, with coverage that may not fall below the thresholds in vite.config.ts.
      - run: npm run coverage
      - run: npm run build

      # The published package as consumers see it: exports, files, and types under every resolution mode.
      - run: npm run publint
      - run: npm run check:types

      # Lists what would ship, so a stray file in the package shows up in the log.
      - run: npm pack --dry-run
