name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile pins every dependency, the solver's git commit included.
      - run: npm ci
      - run: npm run test:run

  check:
    name: Lint, types, coverage, build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The tests again, measured: coverage may not fall below the thresholds in vite.config.ts.
      - run: npm run coverage
      - run: npm run build
      # The package as consumers resolve it: its metadata, and its types under every module setting.
      - run: npm run publint
      - run: npm run check:types
      # Lists what would ship, so a stray file in the package shows up in the log.
      - run: npm pack --dry-run
