name: Release

# Runs when `npm run release` pushes a version tag (see RELEASING.md): checks, publishes to npm with
# provenance, and creates the GitHub Release from the version's section of CHANGELOG.md.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  # Creating the GitHub Release.
  contents: write
  # Provenance, and trusted publishing (OIDC) once it is set up on npmjs.com.
  id-token: write

# Never two releases of one tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      # The tag names the version being released: it must be the one in package.json.
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      # Provenance links the package to this workflow run and commit on npmjs.com. NPM_TOKEN is an
      # organisation secret (an npm granular token); without it npm authenticates by trusted publishing
      # (OIDC). Once trusted publishing is configured for the package on npmjs.com, the token can be
      # deleted. prepublishOnly runs the checks once more, so a stale dist/ can never ship.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub Release
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
